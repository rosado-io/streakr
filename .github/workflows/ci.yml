name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: SonarCloud Scan
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.161.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Semgrep
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: semgrep scan --config auto --sarif --output results.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        if: ${{ always() && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@fb84f6228fd846d3c392887f22b18ce2d9139495
        with:
          sarif_file: results.sarif
          # Intentionally using the old file path to maintain history continuity with previous Semgrep uploads
          category: .github/workflows/semgrep.yml:semgrep

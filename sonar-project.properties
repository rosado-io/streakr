sonar.projectKey=rosado-io_streakr
sonar.organization=rosado-io

# This is the name displayed in the SonarCloud UI.
sonar.projectName=streakr

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src,demo

# Exclude test files and build outputs from analysis
sonar.exclusions=dist/**,dist-demo/**,coverage/**,**/*.test.ts,**/__tests__/**

# Exclude demo from being required to have unit tests
sonar.coverage.exclusions=demo/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Test directories
sonar.tests=src/__tests__
sonar.test.inclusions=**/*.test.ts

# Coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info
